[package]
name = "mtc"
version = "0.2.0"
edition = "2021"

[lib]
name = "mtc"
path = "src/lib.rs"

[[bin]]
name = "mtcodec"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"