[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mtcodec"
version = "1.2.0"
description = "Pure-Python image (.mtb) and video (.mtc) codec with alpha, embedded audio and lossless round-trip"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "The MTB-MTC Authors", email = "xiaomitv14@outlook.com" }]
keywords = ["codec", "image", "video", "compression", "dct", "arithmetic-coding"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.optional-dependencies]
video = ["imageio-ffmpeg>=0.4"]
build = ["pyinstaller>=6.0"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/xiaimiredmi/MTB-MTC"
Documentation = "https://github.com/xiaimiredmi/MTB-MTC/tree/main/docs"
Changelog = "https://github.com/xiaimiredmi/MTB-MTC/blob/main/CHANGELOG.md"
Issues = "https://github.com/xiaimiredmi/MTB-MTC/issues"

[project.scripts]
mtcodec = "mtcodec.cli:main"

[tool.setuptools]
packages = ["mtcodec"]
include-package-data = false

[tool.setuptools.package-data]
mtcodec = ["*.py"]
