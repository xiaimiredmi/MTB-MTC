# nginx site for the MTC demo page.
#
#   sudo cp nginx.conf /etc/nginx/sites-available/mtc
#   sudo ln -s /etc/nginx/sites-available/mtc /etc/nginx/sites-enabled/mtc
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mtc-xiaimiredmi.com -d www.mtc-xiaimiredmi.com
#
# Replace the two server_name lines (and the root, if you put the files
# somewhere else) before using it. certbot rewrites the listen lines for TLS.

server {
    listen 80;
    listen [::]:80;
    server_name mtc-xiaimiredmi.com www.mtc-xiaimiredmi.com;

    root /var/www/mtc;
    index index.html;

    # Ship the text files compressed; the page is ~40 KB of HTML/CSS/JS.
    gzip on;
    gzip_types text/html text/css application/javascript text/plain image/svg+xml;
    gzip_min_length 512;

    # The demo page is a single file per type, so a small cache is plenty.
    location / {
        try_files $uri $uri/ =404;
    }

    # The codec: 104 KB, changes whenever the Rust does, so do not let a browser
    # keep an old one.
    location = /mtc.wasm {
        types {
            application/wasm wasm;
        }
        add_header Cache-Control "no-cache";
    }

    location ~* \.(png|jpg|jpeg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }

    # The sample photo is 376 KB; the rest of the folder is tiny.
    client_max_body_size 8m;
}
