name: site

# Publish site/ to GitHub Pages. One-time setup: Settings -> Pages -> Source:
# "GitHub Actions". After that, https://xiaimiredmi.github.io/mtc/ follows main.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm
      - name: compile the codec to WebAssembly
        run: |
          cargo build --release --target wasm32-unknown-unknown --manifest-path wasm/Cargo.toml
          cp wasm/target/wasm32-unknown-unknown/release/mtcwasm.wasm site/mtc.wasm
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
