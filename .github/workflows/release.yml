name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    name: tests (ubuntu, py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow
      - name: unit tests
        run: python tests/test_codec.py
      - name: format tests
        run: python tests/test_formats.py

  windows-exe:
    name: windows exe
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow pyinstaller
      - name: check tkinter
        run: python -c "import tkinter; tkinter.Tk().destroy(); print('tk ok')"
      - name: build
        run: python tools/build_exe.py
      - name: smoke test the exe
        run: |
          .\dist\MTBViewer.exe samples\photo_c.mtb
          echo "exit=$LASTEXITCODE"
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: MTBViewer-windows-x64
          path: dist/MTBViewer.exe
          if-no-files-found: error
          retention-days: 30
